[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radiate"
version = "0.1.0"
description = "Local-first whole-house hydronic balancing and boiler orchestration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = ["aiohttp>=3.10", "pyyaml>=6", "aiomqtt>=2.3", "tzdata", "joserfc>=1.0"]
# SAML single sign-on (ADR-0006). Needs the libxml2 and xmlsec libraries, and lxml and
# xmlsec built against the same libxml2, so it is not in the standard image or the App.
saml = ["python3-saml>=1.16"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.10",
    "pyyaml>=6",
    "aiomqtt>=2.3",
    "tzdata",
    "joserfc>=1.0",
    "ruff>=0.6",
    # Tests only: checks the hand-written OTLP encoding against the official classes.
    "opentelemetry-proto>=1.27",
]

[project.scripts]
radiate = "radiate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radiate"]

# The web UI is built from web/ (Vite) into src/radiate/web, which is committed, so the
# wheel ships it as part of the package and needs no Node to build.
[tool.hatch.build.targets.wheel.force-include]
"shelly" = "radiate/shelly"

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/config", "tests/drivers", "tests/sim", "tests/server"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM102"]
