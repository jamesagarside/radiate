name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core, simulator and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pytest -q


  saml:
    # SAML login is the optional radiate[saml] extra (ADR-0006). The core job skips its
    # tests; this one installs the extra and runs them with signed fixture assertions.
    name: SAML login extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 && uv pip install -e ".[dev,saml]"
      - run: uv run --no-sync python -c "import xmlsec, lxml.etree as e; print('libxml2', e.LIBXML_VERSION, e.LIBXML_COMPILED_VERSION)"
      - run: uv run --no-sync pytest -q tests/server/test_auth_saml.py
