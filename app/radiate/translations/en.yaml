configuration:
  demo:
    name: Demo mode
    description: Run the simulated reference house instead of your devices.
  config_file:
    name: Config file
    description: House configuration in the App's config folder, used when demo mode is off.
  token:
    name: API token
    description: Optional. Required by clients outside Home Assistant (the sidebar panel does not need it).
  elastic_url:
    name: Elastic URL
    description: Optional. Elasticsearch endpoint for metrics export, for example https://my-deployment.es.europe-west2.gcp.elastic-cloud.com
  elastic_api_key:
    name: Elastic API key
    description: Optional. An API key with permission to write to metrics-radiate.* and logs-radiate.* data streams.
